name: Generate Sitemap

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:      # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.html'
      - '**/*.js'
      - '.github/scripts/generate-sitemap.js'
      - 'package.json'

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🗺️ Generate sitemap
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SERVICE_ACCOUNT_KEY: ${{ secrets.SERVICE_ACCOUNT_KEY }}
        run: npm run generate-sitemap

      - name: ✅ Verify sitemap
        run: |
          echo "🔍 Verifying generated files..."

          if [ ! -f sitemap.xml ]; then
            echo "❌ sitemap.xml not generated!"
            exit 1
          fi

          if [ ! -f robots.txt ]; then
            echo "⚠️ robots.txt not generated"
          else
            echo "✅ robots.txt generated"
          fi

          URL_COUNT=$(grep -c "<loc>" sitemap.xml || echo "0")
          echo ""
          echo "📊 Sitemap Statistics:"
          echo "   Total URLs: $URL_COUNT"

          PRODUCT_COUNT=$(grep -c "details.html?id=" sitemap.xml || echo "0")
          echo "   Product URLs: $PRODUCT_COUNT"

          SELLER_COUNT=$(grep -c "store.html?store=" sitemap.xml || echo "0")
          echo "   Seller URLs: $SELLER_COUNT"

          STATIC_COUNT=$((URL_COUNT - PRODUCT_COUNT - SELLER_COUNT))
          echo "   Static URLs: $STATIC_COUNT"

          # Ensure NO cross-domain URLs slipped in
          EXTERNAL_COUNT=$(grep -c "volantpoetry.vercel.app\|volantreads.vercel.app" sitemap.xml || echo "0")
          if [ "$EXTERNAL_COUNT" -gt 0 ]; then
            echo "❌ Found $EXTERNAL_COUNT cross-domain URLs — sitemap must only contain volantmall URLs!"
            exit 1
          else
            echo "   ✅ No cross-domain URLs"
          fi

          echo ""
          echo "📄 First 15 lines of sitemap.xml:"
          head -15 sitemap.xml

          echo ""
          echo "🔍 Validating XML..."
          if command -v xmllint &> /dev/null; then
            if xmllint --noout sitemap.xml 2>/dev/null; then
              echo "✅ sitemap.xml is valid XML"
            else
              echo "⚠️ sitemap.xml may have XML issues"
            fi
          fi

      - name: 📤 Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add sitemap.xml robots.txt

          if git diff --staged --quiet; then
            echo "📝 No changes to commit"
          else
            git commit -m "🤖 Auto-update sitemap and robots.txt [skip ci]"
            git push
            echo "✅ Changes pushed successfully"
          fi

      - name: 📊 Sitemap Summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "✅ Sitemap Generation Complete!"
          echo "═══════════════════════════════════════════════"
          echo ""
          echo "📁 Files generated:"
          echo "   - sitemap.xml"
          echo "   - robots.txt"
          echo ""
          echo "🌐 Sitemap URL:"
          echo "   https://volantmall.vercel.app/sitemap.xml"
          echo ""
          echo "📋 robots.txt URL:"
          echo "   https://volantmall.vercel.app/robots.txt"
          echo ""
          echo "🛒 Indexed content:"
          echo "   - Mall homepage"
          echo "   - Product detail pages"
          echo "   - Seller store pages"
          echo "   - Submit / FAQ / Refund pages"
          echo ""
          echo "═══════════════════════════════════════════════"
