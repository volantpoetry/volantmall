<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Orders — Volant Mall</title>
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body>

    <header class="topbar">
        <div class="topbar-inner">
            <a class="logo" href="index.html">
                <img src="https://volantpoetry.vercel.app/images/logokk.png" alt="Volant Mall Logo">
                <span class="logo-text"><span class="logo-highlight">Volant</span> Mall</span>
            </a>
            <div class="topbar-right">
                <a class="btn btn-ghost btn-sm" href="submit.html"><i class="fas fa-store"></i> Sell</a>
                <a class="btn btn-ghost btn-sm" href="index.html"><i class="fas fa-arrow-left"></i> Shop</a>
                <button class="icon-btn" id="userBtn" title="Account" onclick="accountClick()"></button>
            </div>
        </div>
    </header>

    <div class="container">
        <section class="section" id="gate" style="display:none;">
            <div class="empty-state">
                <i class="fas fa-box-open"></i>
                <h2 style="font-size:1.5rem;margin-bottom:0.6rem;">Your orders</h2>
                <p style="color:var(--ink-soft);margin-bottom:1.2rem;">Sign in to see your purchases and track delivery.</p>
                <button class="btn btn-primary" onclick="requireAuth('orders.html')"><i class="fas fa-sign-in-alt"></i> Sign in</button>
            </div>
        </section>

        <section class="section" id="ordersSec" style="display:none;">
            <div class="section-head"><h2>My Orders</h2></div>
            <div id="orderList"><div class="spinner-wrap"><div class="spinner"></div></div></div>
        </section>
    </div>

    <footer class="site-footer">
        <div class="foot-inner">
            <div class="foot-col">
                <h4>Volant Mall</h4>
                <a href="index.html">Shop</a>
                <a href="submit.html">Become a Seller</a>
                <a href="orders.html">My Orders</a>
                <a href="faq.html">How it Works & FAQ</a>
            </div>
            <div class="foot-col">
                <h4>Help</h4>
                <a href="../../shared/terms.html">Terms</a>
                <a href="../../shared/privacy.html">Privacy</a>
                <a href="../../shared/contact.html">Contact</a>
            </div>
            <div class="foot-col">
                <h4>Platform</h4>
                <a href="../../index.html">Volant Poetry</a>
                <a href="../../lyrics/index.html">Volant Lyrics</a>
                <a href="https://volantreads.vercel.app/">Volant Reads</a>
                <a href="../../codes/index.html">Volant Codes</a>
            </div>
        </div>
        <div class="foot-copy">© 2026 Volant Foundry · Made for Ghana 🇬🇭</div>
    </footer>

    <div id="toast"></div>

    <script src="app.js"></script>
    <script>
    function onAppAuthChange(user) {
        if (user) { document.getElementById('gate').style.display = 'none'; document.getElementById('ordersSec').style.display = ''; loadOrders(); }
        else { document.getElementById('gate').style.display = ''; document.getElementById('ordersSec').style.display = 'none'; }
    }

    const statusLabels = { processing: 'Processing', completed: 'Delivered', cancelled: 'Cancelled' };
    const statusClasses = { processing: 'processing', completed: 'completed', cancelled: 'cancelled' };

    async function loadOrders() {
        try {
            const snap = await db.collection('mall-orders')
                .where('userId', '==', currentUser.uid)
                .orderBy('purchasedAt', 'desc')
                .limit(50)
                .get();
            const orders = [];
            snap.forEach(doc => { const d = doc.data(); orders.push({ id: doc.id, ...d }); });

            const list = document.getElementById('orderList');
            if (!orders.length) {
                list.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><p>No orders yet.</p><a class="btn btn-primary btn-sm" href="index.html">Start shopping</a></div>`;
                return;
            }

            list.innerHTML = orders.map(o => `
                <div class="order-card">
                    <div class="order-head">
                        <div>
                            <div class="order-ref">#${escapeHtml(String(o.ref || o.id).slice(0, 18))}</div>
                            <div class="order-date">${new Date(o.purchasedAt && o.purchasedAt.toDate ? o.purchasedAt.toDate() : Date.now()).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })} · ${escapeHtml(o.sellerName || 'Store')}</div>
                        </div>
                        <span class="status-badge ${statusClasses[o.orderStatus] || 'processing'}">${statusLabels[o.orderStatus] || o.orderStatus}</span>
                    </div>
                    ${o.items.map(it => `
                        <div class="order-item">
                            <div class="oi-img">${it.image ? `<img src="${escapeHtml(it.image)}" alt="">` : `<i class="fas fa-box-open" style="color:#b7aad9;"></i>`}</div>
                            <div style="flex:1;">
                                <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(it.title)}</div>
                                <div style="font-size:0.78rem;color:var(--ink-soft);">${it.qty} × ${formatGHS(it.price)}${it.fulfillment === 'delivery' ? ' · + ' + formatGHS(it.deliveryFee) + ' delivery' : ' · pickup'}</div>
                            </div>
                            <strong>${formatGHS((it.price * it.qty) + (it.fulfillment === 'delivery' ? (it.deliveryFee || 0) : 0))}</strong>
                        </div>`).join('')}
                    <div class="order-meta">
                        ${o.shipping ? `
                            <span class="lab"><i class="fas fa-truck"></i> Delivered to</span>
                            <span>${escapeHtml(o.shipping.name)} · ${escapeHtml(o.shipping.phone)}<br>${escapeHtml(o.shipping.address)}, ${escapeHtml(o.shipping.city)}, ${escapeHtml(o.shipping.region)}</span>` : ''}
                        <span class="lab"><i class="fas fa-wallet"></i> Paid</span>
                        <span><strong>${formatGHS(o.amount)}</strong> via Paystack</span>
                    </div>
                </div>`).join('');
        } catch (err) {
            console.error('Orders load error:', err);
            if (String(err.message || '').includes('index')) {
                document.getElementById('orderList').innerHTML = `<div class="empty-state"><p>Your Firestore needs a composite index for mall-orders (userId + purchasedAt). Add it in the Firebase console.</p></div>`;
            } else {
                document.getElementById('orderList').innerHTML = `<div class="empty-state"><p>Could not load orders.</p></div>`;
            }
        }
    }

    function accountClick() {
        if (currentUser) signOutUser(); else requireAuth('orders.html');
    }
    </script>
</body>
</html>
